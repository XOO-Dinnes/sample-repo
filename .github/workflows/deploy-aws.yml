name: Deploy to AWS ECR

# Triggers when code is pushed to main branch
# Same as Bitbucket: branches: main:
on:
  push:
    branches:
      - main

jobs:

  # Step 1 - Prove AWS access (same as Bitbucket Step 1)
  prove-aws-access:
    name: Prove AWS Access
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: List ECR repositories
        run: aws ecr describe-repositories --region ${{ secrets.AWS_DEFAULT_REGION }}

  # Step 2 - Build Docker image and push to ECR (same as Bitbucket Step 2)
  build-and-push:
    name: Build and Push Docker image to ECR
    runs-on: ubuntu-latest
    needs: prove-aws-access
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com

      - name: Build Docker image
        run: docker build -t test-repo .

      - name: Tag Docker image
        run: |
          docker tag test-repo:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/test-repo:latest

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/test-repo:latest
